:root{
  --night:#04050d; --ink:#eef3ff; --gold:#ffd27a; --glass:rgba(255,255,255,.09); --line:rgba(255,255,255,.18);

html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));display:flex;gap:10px;transition:opacity .6s}
.ui button,.hint{font:inherit;color:var(--ink);background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer}
.ui button{width:44px;height:44px;border-radius:50%;font-size:20px;line-height:1;display:grid;place-items:center;position:relative}
.ui button.off::after{content:"";position:absolute;width:26px;height:2px;background:currentColor;transform:rotate(-45deg)}
.ui.hide{opacity:0;pointer-events:none}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.hint{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:11px 20px;border-radius:999px;font-family:var(--f-ui);font-size:15px;white-space:nowrap;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 22px rgba(255,210,122,.35)}}
.cap{position:fixed;left:16px;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));margin:0;text-align:center;font-family:var(--f-display);font-size:clamp(17px,2.6vw,28px);letter-spacing:.06em;color:var(--gold);text-shadow:0 0 18px rgba(255,190,90,.6);opacity:0;transition:opacity 1.6s;pointer-events:none}
.cap.show{opacity:1}
body.nocursor{cursor:none}
.panel{position:fixed;top:calc(66px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:min(310px,calc(100vw - 24px));max-height:calc(100vh - 96px);overflow-y:auto;padding:14px 16px;border-radius:16px;background:rgba(10,14,34,.82);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 16px 40px rgba(0,0,0,.55);font-family:var(--f-ui);font-size:13px;color:var(--ink);z-index:20;opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none;transition:opacity .22s,transform .22s}
.panel.open{opacity:1;transform:none;pointer-events:auto}
.panel h3{margin:12px 0 6px;font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center}
.panel h3:first-child{margin-top:0}
.panel .stat{font-size:11px;color:rgba(238,243,255,.72);font-weight:400}
.songs{display:flex;flex-direction:column;gap:4px}
.songs button,.chips button{font:inherit;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:9px;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.songs button{text-align:left;padding:7px 10px;font-size:12.5px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<canvas id="c" role="img" aria-label="반짝이는 크리스마스트리 애니메이션"></canvas>

</div>

    <button data-v="30">30분</button>
    <button data-v="60">1시간</button>
    <button data-v="120">2시간</button>
  </div>
</aside>
<div class="sleep" id="sleep">
  <div>
    <p>🌙 설정한 시간이 되어 트리가 쉬고 있습니다</p>
    <button id="wake">✨ 트리 다시 켜기</button>
  </div>
</div>
<p class="cap" id="cap"></p>
<button class="hint" id="hint">♪ 탭해서 캐럴 켜기</button>

<script>
const $=id=>document.getElementById(id);
const cv=$('c'), cx=cv.getContext('2d');
const TAU=Math.PI*2, rnd=Math.random, PI=Math.PI;
const coarse=matchMedia('(pointer:coarse)').matches||Math.min(screen.width,screen.height)<700;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const N=coarse?{f:1400,g:240,l:72,b:20,s:420,gr:260}:{f:2600,g:420,l:110,b:30,s:850,gr:480};

// ---------- 색과 스프라이트 ----------
const FOL=['#1f8a4c','#2fae63','#49cc7e','#8fe8ab','#d2fbdc','#8a5a34','#ffd27a','#ff5a78','#fff7ea'];
const LC=['#ff3b5c','#ffcc4d','#4dc3ff','#fff1d6','#ff7ad9','#7dff9e'];
const BC=['#e8173f','#ffb300','#2f7bff','#c9d2e0','#a63cff','#ff6b9a'];
const GIFT=[['#c8102e','#ffd27a'],['#1f5fd6','#f4f4f4'],['#2e9b57','#ff4d6d'],['#7a3cff','#ffd27a']];
function rgb(h){const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]}
function rgba(h,a){const c=rgb(h);return`rgba(${c[0]},${c[1]},${c[2]},${a})`}
function shade(h,k){const c=rgb(h).map(v=>Math.max(0,Math.min(255,k>0?v+(255-v)*k:v*(1+k)))|0);return`rgb(${c})`}
function mk(s){const c=document.createElement('canvas');c.width=c.height=s;return[c,c.getContext('2d')]}
function glow(h){const[c,g]=mk(64),r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'#fff');r.addColorStop(.13,rgba(h,1));r.addColorStop(.38,rgba(h,.3));r.addColorStop(1,rgba(h,0));g.fillStyle=r;g.fillRect(0,0,64,64);return c}
function mkFlare(){const[c,g]=mk(128);g.translate(64,64);const r=g.createRadialGradient(0,0,0,0,0,64);r.addColorStop(0,'#fff');r.addColorStop(.25,'rgba(255,244,220,.6)');r.addColorStop(1,'rgba(255,230,180,0)');g.fillStyle=r;g.beginPath();for(let k=0;k<8;k++){const a=k*PI/4,R=k%2?5:64;g.lineTo(Math.cos(a)*R,Math.sin(a)*R)}g.fill();g.beginPath();g.arc(0,0,9,0,TAU);g.fill();return c}
const DOT=FOL.map(glow), LGL=LC.map(glow), FLARE=mkFlare();
const GCACHE=new Map(), GFONT='700 84px ui-monospace,Menlo,"Apple SD Gothic Neo","Noto Sans KR",monospace';
function glyphC(ch,col){const k=ch+col;let c=GCACHE.get(k);if(!c){let g;[c,g]=mk(128);g.font=GFONT;g.textAlign='center';g.textBaseline='middle';g.shadowColor=col;g.shadowBlur=18;g.fillStyle=col;g.fillText(ch,64,68);GCACHE.set(k,c)}return c}
const glyph=(ch,ci)=>glyphC(ch,FOL[ci]);
const GL=[[...'*+^:x✦·'],[...'MERRYCHRISTMAS'],[...'메리크리스마스'],[...'NOEL★✦']];
const LCH=[...'*●✱•'], BCH=[...'@◉✪❂✺◎']; // 문자 버전의 전구·오너먼트

// ---------- 트리 데이터 ----------
const R=t=>{const f=(t*6)%1;return .45*(1-t)*(.7+.3*(1-f))+.015}; // 6단으로 층진 원뿔
const F32=n=>new Float32Array(n);
const fA=F32(N.f),fR=F32(N.f),fY=F32(N.f),fH=F32(N.f),fG=F32(N.f),fQ=F32(N.f),fP=F32(N.f),fS=F32(N.f),fC=new Uint8Array(N.f);
for(let i=0;i<N.f;i++){
  if(i<40){fY[i]=rnd()*.07;fR[i]=.035*Math.sqrt(rnd());fC[i]=5}
  else{let t;do t=rnd();while(rnd()>1-t*.85);const r=R(t);fY[i]=.07+t*.93;fR[i]=rnd()<.8?r*(.8+.2*rnd()):r*rnd();fC[i]=rnd()<.07?4:rnd()*4|0}
  fA[i]=rnd()*TAU;fH[i]=rnd();fG[i]=rnd();fQ[i]=rnd();fP[i]=rnd()*TAU;fS[i]=1+rnd()*3;
}
const gA=F32(N.g),gR=F32(N.g),gY=F32(N.g),gS=F32(N.g),gH=F32(N.g);
for(let i=0;i<N.g;i++){const s=i/N.g,t=.05+s*.86;gS[i]=s;gY[i]=.07+t*.93;gA[i]=s*TAU*5+(i%2)*PI;gR[i]=R(t)*1.04+.006;gH[i]=rnd()}
const lA=F32(N.l),lR=F32(N.l),lY=F32(N.l),lH=F32(N.l),lP=F32(N.l),lF=F32(N.l),lC=new Uint8Array(N.l),lFC=new Uint8Array(N.l);
for(let i=0;i<N.l;i++){const t=.03+rnd()*.9;lY[i]=.07+t*.93;lA[i]=rnd()*TAU;lR[i]=R(t)*1.04;lH[i]=rnd();lP[i]=rnd()*TAU;lC[i]=i%6}
const B=[];
for(let i=0;i<N.b;i++){const t=.08+rnd()*.76;B.push({k:'b',a:i*2.39996+rnd()*.3,r:R(t)*1.07,y:.07+t*.93,h:rnd(),s:.019+rnd()*.013,c:i%6,ph:rnd()*TAU,p:0,sx:0,sy:0,vis:0})}
[.5,1.95,3.4,4.9].forEach((a,i)=>B.push({k:'g',a,r:.3+(i%2)*.09,y:0,h:rnd(),s:.075+(i%3)*.017,c:i,ph:0,p:0,done:0}));
const sX=F32(N.s),sY=F32(N.s),sZ=F32(N.s),sV=F32(N.s),sP=F32(N.s),sK=F32(N.s),sO=F32(N.s);
for(let i=0;i<N.s;i++){sX[i]=(rnd()-.5)*3.2;sY[i]=rnd()*1.8-.1;sZ[i]=(rnd()-.5)*3.2;sP[i]=rnd()*TAU;sO[i]=rnd();
  const big=rnd()<.06;sK[i]=big?2.6+rnd()*2.6:.5+rnd()*1.3;sV[i]=(.05+rnd()*.09)*(big?1.6:1)} // 6%는 카메라 가까운 큰 눈송이(보케)
let acc=.15; // 쌓인 눈 양 0~1
const grA=F32(N.gr),grR=F32(N.gr);for(let i=0;i<N.gr;i++){grA[i]=rnd()*TAU;grR[i]=.12+Math.sqrt(rnd())*.85}
const SKY=Array.from({length:90},()=>[rnd(),rnd()*.75,rnd()*TAU,.4+rnd()*1.6]);
// 먼 하늘 산타 썰매 + 별가루 꼬리 풀
const STN=60,stX=F32(STN),stY=F32(STN),stVX=F32(STN),stVY=F32(STN),stL=F32(STN),stM=F32(STN),stC=new Uint8Array(STN);let stI=0;
const santa={on:0,t:0,dur:16,next:2.5,dir:1,y0:.2,y1:.16,arc:-.08,emit:0,x:0,y:0,sc:1};
const starPos={x:0,y:0,vis:0};
function startSanta(now){
  santa.on=1;santa.t=0;santa.dur=RM?26:15+rnd()*4;
  santa.y0=.12+rnd()*.18;santa.y1=.10+rnd()*.18;santa.arc=-(.05+rnd()*.06);
  santa.emit=0;
}
function addStardust(x,y,vx,vy,ci){
  stX[stI]=x;stY[stI]=y;stVX[stI]=vx;stVY[stI]=vy;
  stM[stI]=stL[stI]=1.1+rnd()*1.1;stC[stI]=ci;stI=(stI+1)%STN;
}
// 불꽃 파티클 풀 + 클릭 파동 링 풀
const MS=520,pX=F32(MS),pY=F32(MS),pVX=F32(MS),pVY=F32(MS),pL=F32(MS),pM=F32(MS),pC=new Uint8Array(MS);let pI=0;
function burst(x,y,n,ci,sp=1){for(let k=0;k<n;k++){const a=rnd()*TAU,v=(50+rnd()*170)*sp*SC_;pX[pI]=x;pY[pI]=y;pVX[pI]=Math.cos(a)*v;pVY[pI]=Math.sin(a)*v-60*sp*SC_;pM[pI]=pL[pI]=.6+rnd()*.9;pC[pI]=ci==null?rnd()*6|0:ci;pI=(pI+1)%MS}}
const RN=16,rX=F32(RN),rY=F32(RN),rL=F32(RN),rM=F32(RN),rR=F32(RN),rC=new Uint8Array(RN);let rI=0;
function addRing(x,y,rad,ci){rX[rI]=x;rY[rI]=y;rM[rI]=rL[rI]=.78;rR[rI]=rad;rC[rI]=ci;rI=(rI+1)%RN}

// ---------- 장면(카메라·연출) ----------
const SCENES=[
  {g:0,  gs:0,lp:0,yaw:.22, pitch:.12, dist:2.6, ty:.52},             // 정면 궤도
  {g:1,  gs:0,lp:1,yaw:-.16,pitch:-.24,dist:2.05,ty:.62},             // 아래서 올려다봄, 문자 트리
  {g:0,  gs:0,lp:2,yaw:.45, pitch:1.05,dist:2.5, ty:.42,burst:1},     // 위에서 내려다보며 흩어졌다 모임
  {g:.5, gs:1,lp:3,yaw:.18, pitch:.1,  dist:2.8, ty:.5, text:1},      // MERRY CHRISTMAS 글자로 변신
  {g:1,  gs:2,lp:1,yaw:.32, pitch:.32, dist:1.45,ty:.8},              // 별 근처 클로즈업, 한글 문자
  {g:.35,gs:3,lp:0,yaw:-.28,pitch:.04, dist:3.25,ty:.47},             // 멀리서 눈 내리는 풍경
].filter(s=>!(RM&&s.burst));
const SDUR=RM?32:20;
let cur=SCENES[0],order=[],sceneT0=0;
function nextScene(T){
  if(!order.length){order=SCENES.slice().sort(()=>rnd()-.5);if(order[0]===cur)order.push(order.shift())}
  cur=order.shift();sceneT0=T;burstStar=1;tmT=1-tmT; // 장면마다 그래픽↔문자 교대
}
const cam={yaw:0,pitch:.12,dist:2.6,ty:.52,ys:.22};
let G=0,E=0,K=0,LP=0,burstStar=0,starP=0,TM=0,tmT=0; // TM: 0=그래픽 버전, 1=문자 버전
const env=(u,a,b,c,d)=>{const s=x=>x<=0?0:x>=1?1:x*x*(3-2*x);return s((u-a)/(b-a))*(1-s((u-c)/(d-c)))};

// ---------- 투영 ----------
let W,H,DPR,FOC,SC_=1,BG,CX,CY,CZ,rx,rz,ux,uy,uz,fx,fy,fz,PX,PY,PZ,WX,WY,WZ,T=0;
const TX=F32(N.f),TY=F32(N.f);
function setCam(){
  const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch),sy=Math.sin(cam.yaw),cy=Math.cos(cam.yaw);
  CX=sy*cp*cam.dist;CY=cam.ty+sp*cam.dist;CZ=cy*cp*cam.dist;
  fx=-sy*cp;fy=-sp;fz=-cy*cp;
  const l=Math.hypot(fz,fx);rx=-fz/l;rz=fx/l;
  ux=-rz*fy;uy=rz*fx-rx*fz;uz=rx*fy;
}
function proj(x,y,z){const vx=x-CX,vy=y-CY,vz=z-CZ;PZ=vx*fx+vy*fy+vz*fz;if(PZ<.06){PZ=-1;return}const X=vx*rx+vz*rz,Y=vx*ux+vy*uy+vz*uz;PX=W*.5+X/PZ*FOC;PY=H*.47-Y/PZ*FOC}
function place(a,r,y,h){if(E>0){a+=E*3*(h-.3);r*=1+E*(.5+2.3*h);y+=E*((h-.45)*.9+.06*Math.sin(T*1.3+h*20))}WX=Math.cos(a)*r;WY=y;WZ=Math.sin(a)*r}
const depth=Z=>{const d=1.2-(Z-cam.dist)*1.3;return d<.26?.26:d>1.25?1.25:d};

function sampleText(){

function drawReindeer(rx,ry,ph,rudolph){

function drawSanta(dt){
  // 별가루 꼬리 업데이트 및 그리기
  cx.globalCompositeOperation='lighter';
  for(let i=0;i<STN;i++){
    if(stL[i]<=0)continue;
    stL[i]-=dt;stVY[i]+=12*dt;stX[i]+=stVX[i]*dt;stY[i]+=stVY[i]*dt;
    const l=stL[i]/stM[i],a=l*.65*(1-K*.4);
    if(a<.01)continue;
    if(i%10<TM*10)spr(glyphC(i%3?'·':'✦',stC[i]?'#fff4d2':'#ffd27a'),stX[i],stY[i],(5+6*l)*SC_,a);
    else spr(DOT[stC[i]?8:6],stX[i],stY[i],(4+6*l)*SC_,a);
  }
  if(!santa.on){if(T>=santa.next)startSanta(T);return}
  santa.t+=dt;
  const u=santa.t/santa.dur;
  if(u>=1){santa.on=0;santa.dir=-santa.dir;santa.next=T+(RM?24:11+rnd()*8);return}
  const sc=Math.max(.58,Math.min(1.12,Math.min(W,H)/760));
  const pad=155*sc,dir=santa.dir;
  const posAt=uu=>[
    dir>0?-pad+(W+pad*2)*uu:W+pad-(W+pad*2)*uu,
    H*(santa.y0+(santa.y1-santa.y0)*uu+santa.arc*Math.sin(uu*PI))+Math.sin(uu*PI*3)*5*sc
  ];
  const[x,y]=posAt(u),[x2,y2]=posAt(u+.004);
  santa.x=x;santa.y=y;santa.sc=sc;
  const ang=Math.atan2(y2-y,(x2-x)*dir);
  const fade=Math.min(1,u*10,(1-u)*10)*(1-K*.35);
  // 썰매 뒤 별가루 생성
  santa.emit+=dt*(RM?10:28);
  const ca=Math.cos(ang),sa=Math.sin(ang);
  while(santa.emit>=1){
    santa.emit-=1;
    const lx=-42*sc,ly=(8+(rnd()-.5)*8)*sc;

    for(let i=0;i<3;i++){cx.moveTo(-3,-8);cx.quadraticCurveTo((deerX[i]-3)*.5,deerY[i]+3,deerX[i]+9,deerY[i]-5)}
    cx.stroke();

    cx.lineWidth=1.2;cx.beginPath();cx.moveTo(-30,11);cx.lineTo(-30,5);cx.moveTo(-5,11);cx.lineTo(-5,5);cx.stroke();
    // 선물 보따리

  else while(noteQ.length&&noteQ[0].t<=AC.currentTime){const e=noteQ.shift();if(e.title||AC.currentTime-e.t<.3)onNote(e)}

  setCam();

  cx.globalCompositeOperation='source-over';cx.globalAlpha=1;cx.fillStyle=BG;cx.fillRect(0,0,W,H);
  cx.globalCompositeOperation='lighter';
  for(const s of SKY){const x=((s[0]*W+cam.yaw*40)%W+W)%W;const sa=.25+.25*Math.sin(T*s[3]+s[2]);if(s[2]/TAU<TM)spr(glyph(s[3]>1.4?'+':'·',8),x,s[1]*H,s[3]*6,sa);else spr(DOT[8],x,s[1]*H,s[3]*3,sa)}

  dl.delayTime.value=.28;fb.gain.value=.2;dlLP.type='lowpass';dlLP.frequency.value=2400;
  send.connect(dl);dl.connect(dlLP);dlLP.connect(fb);fb.connect(dl);dlLP.connect(master);dlLP.connect(revSend);
  const len=AC.sampleRate*.06|0;noise=AC.createBuffer(1,len,AC.sampleRate);const ch=noise.getChannelData(0);for(let i=0;i<len;i++)ch[i]=rnd()*2-1;
  resetSongBus();
  if(playMode==='rnd'&&!rndBag.length){curSong=rnd()*SONGS.length|0}
  songStart=AC.currentTime+.25;evI=0;playedCount=0;songDone=false;
  syncPanel();
  setInterval(sched,200);sched();
}
function env2(g,at,peak,a,end){g.gain.setValueAtTime(.0001,at);g.gain.linearRampToValueAtTime(peak,at+a);g.gain.exponentialRampToValueAtTime(.0001,Math.max(at+a+.02,end))}
function osc(type,f,at,end,dest,detune=0){const o=AC.createOscillator();o.type=type;o.frequency.value=f;if(detune)o.detune.value=detune;o.connect(dest);o.start(at);o.stop(end+.05);return o}
// 진짜 오르골 쇠빗(Steel Tine) 합성: 맑은 사인 기본음 + 외팔보 비정수배 금속 배음(2.76x, 5.4x) + 핀 튕김 틱
function playTine(m,at,vol,dur,dest=songBus||master){
  const f=hz(m),t=at+(rnd()-.5)*.01,ring=Math.max(1.2,Math.min(3.2,dur*2.4));
  // 쇠빗 배치처럼 저음은 왼쪽, 고음은 오른쪽으로 미세 패닝
  const pan=Math.max(-.42,Math.min(.42,(m-72)*.022));
  const bus=panTo(pan,dest);
  // 1) 깨끗하고 길게 여운이 남는 기본음
  const g1=AC.createGain();env2(g1,t,vol,.003,t+ring);
  g1.connect(bus);g1.connect(revSend);g1.connect(send);
  osc('sine',f,t,t+ring,g1);
  // 2) 오르골 특유의 영롱한 비정수배 금속 배음 (짧고 투명하게 반짝임)
  if(f*2.756<12000){
    const g2=AC.createGain();env2(g2,t,vol*.24,.002,t+.24);
    g2.connect(bus);g2.connect(revSend);
    osc('sine',f*2.756,t,t+.26,g2);
  }
  if(f*5.404<14000){
    const g3=AC.createGain();env2(g3,t,vol*.09,.0015,t+.09);
    g3.connect(bus);
    osc('sine',f*5.404,t,t+.11,g3);
  }
  // 3) 실린더 핀이 쇠빗을 튕기는 미세한 아날로그 '틱' 클릭
  if(noise){
    const s=AC.createBufferSource();s.buffer=noise;
    const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=Math.min(6500,Math.max(2400,f*2.2));bp.Q.value=3.5;
    const cg=AC.createGain();env2(cg,t,vol*.14,.001,t+.016);
    s.connect(bp);bp.connect(cg);cg.connect(bus);s.start(t);s.stop(t+.025);
  }
}
function play(e,at){
  if(e.title){noteQ.push({t:at,title:e.title});return}
  if(e.k==='n'){playTine(e.m,at,.21*(e.vel||1),e.d+.4);noteQ.push({t:at,m:e.m});return}
  if(e.k==='a'){playTine(e.m,at,.095,e.d+.3);return}
  if(e.k==='b'){playTine(e.m,at,.14,e.d+.5);noteQ.push({t:at,beat:1});return}
}
function sched(){
  if(!AC||AC.state!=='running'||songDone)return;
  const end=AC.currentTime+1.5;
  for(;;){
    const cur=SONG_EV[curSong];
    if(evI>=cur.ev.length){
      playedCount++;
      if(maxPlays>0&&playedCount>=maxPlays){
        songDone=true;syncPanel();
        const waitMs=Math.max(400,(songStart+cur.dur-AC.currentTime)*1000+1200);
        clearTimeout(stopTimer);
        stopTimer=setTimeout(async()=>{
          if(!songDone)return;
          if(AC&&AC.state==='running')await AC.suspend().catch(()=>{});
          audioOn=false;
          $('snd').classList.add('off');$('snd').setAttribute('aria-pressed',false);
          showCap('♪ 설정한 재생을 마쳤습니다');syncPanel();
        },waitMs);
        break;
      }
      songStart+=cur.dur;
      curSong=pickNextSong();evI=0;saveCfg();syncPanel();
      continue;
    }
    const e=cur.ev[evI],at=songStart+e.t;
    if(at>end)break;
    if(at>AC.currentTime-.05)play(e,at); // 백그라운드 탭에서 밀린 음은 건너뜀
    evI++;
  }
}
async function playSongNow(idx){
  curSong=idx;playedCount=0;songDone=false;clearTimeout(stopTimer);saveCfg();
  if(!AC){initAudio();audioOn=true}
  else{
    if(AC.state!=='running')await AC.resume().catch(()=>{});
    audioOn=true;noteQ.length=0;resetSongBus();
    songStart=AC.currentTime+.12;evI=0;sched();
  }
  $('snd').classList.remove('off');$('snd').setAttribute('aria-pressed',true);
  $('hint').hidden=true;lock();syncPanel();
}
async function toggleSound(force){
  clearTimeout(stopTimer);
  if(!AC){initAudio();audioOn=true}
  else if(force||AC.state!=='running'||songDone){
    if(songDone){playedCount=0;songDone=false;noteQ.length=0;resetSongBus();songStart=AC.currentTime+.15;evI=0}
    await AC.resume().catch(()=>{});audioOn=true;sched();
  }
  else{await AC.suspend();audioOn=false}
  if(audioOn&&AC.state!=='running')await AC.resume().catch(()=>{});
  $('snd').classList.toggle('off',!audioOn);$('snd').setAttribute('aria-pressed',audioOn);
  $('hint').hidden=true;lock();syncPanel();
}

// ---------- 화면 유지·설정 패널·슬립 타이머 ----------
let wl=null;
async function lock(){try{if(!animStopped&&'wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}}catch(e){}}
async function unlock(){try{if(wl){await wl.release();wl=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!animStopped)lock()});

function sleepTree(){
  animStopped=true;cancelAnimationFrame(animRaf);
  clearTimeout(stopTimer);
  if(AC&&AC.state==='running')AC.suspend().catch(()=>{});
  audioOn=false;$('snd').classList.add('off');$('snd').setAttribute('aria-pressed',false);
  unlock();setPanel(false);
  $('sleep').classList.add('show');syncPanel();
}
function wakeTree(){
  $('sleep').classList.remove('show');
  animStopped=false;lt=performance.now()/1000;
  if(animDurMin>0)animEndAt=Date.now()+animDurMin*60000;
  lock();animRaf=requestAnimationFrame(frame);syncPanel();
}
function setAnimDur(min){
  animDurMin=min;animEndAt=min>0?Date.now()+min*60000:0;syncPanel();
}
setInterval(()=>{
  if(animStopped||!animEndAt)return;
  if(Date.now()>=animEndAt){sleepTree();return}
  if(panelOpen)syncPanel();
},1000);

function setPanel(open){
  panelOpen=open;
  $('panel').classList.toggle('open',open);
  $('cfg').setAttribute('aria-expanded',open);
  if(open){showUI();syncPanel()}else showUI();
}
function syncPanel(){
  const list=$('songList');
  if(list&&!list.children.length){
    SONGS.forEach((s,i)=>{
      const b=document.createElement('button');
      b.dataset.i=i;b.textContent=`${i+1}. ${s.title.split(' · ')[1]||s.title}`;
      b.onclick=e=>{e.stopPropagation();playSongNow(i)};
      list.appendChild(b);
    });
  }
  if(list)[...list.children].forEach((b,i)=>b.classList.toggle('on',i===curSong));
  $('songStat').textContent=audioOn?'재생 중':'대기';
  [...$('modeChips').children].forEach(b=>b.classList.toggle('on',b.dataset.v===playMode));
  [...$('repChips').children].forEach(b=>b.classList.toggle('on',+b.dataset.v===maxPlays));
  $('repStat').textContent=maxPlays>0?(songDone?'완료':`${Math.max(0,maxPlays-playedCount)}곡 남음`):'무한';
  [...$('durChips').children].forEach(b=>b.classList.toggle('on',+b.dataset.v===animDurMin));
  if(animDurMin>0&&animEndAt&&!animStopped){
    const rem=Math.max(0,Math.ceil((animEndAt-Date.now())/1000));
    const mm=String(rem/60|0).padStart(2,'0'),ss=String(rem%60).padStart(2,'0');
    $('durStat').textContent=`${mm}:${ss} 남음`;
  }else $('durStat').textContent=animDurMin>0?'종료됨':'계속 켜두기';
}

$('panel').addEventListener('pointerdown',e=>e.stopPropagation());
$('cfg').onclick=e=>{e.stopPropagation();setPanel(!panelOpen)};
$('modeChips').onclick=e=>{const b=e.target.closest('button');if(!b)return;e.stopPropagation();playMode=b.dataset.v;rndBag=[];saveCfg();syncPanel()};
$('repChips').onclick=e=>{const b=e.target.closest('button');if(!b)return;e.stopPropagation();maxPlays=+b.dataset.v;playedCount=0;songDone=false;clearTimeout(stopTimer);saveCfg();syncPanel()};
$('durChips').onclick=e=>{const b=e.target.closest('button');if(!b)return;e.stopPropagation();setAnimDur(+b.dataset.v)};
$('wake').onclick=e=>{e.stopPropagation();wakeTree()};
$('hint').onclick=e=>{e.stopPropagation();toggleSound(true)};
$('snd').onclick=e=>{e.stopPropagation();toggleSound()};
const fsb=$('fs');
if(!document.fullscreenEnabled&&!document.webkitFullscreenEnabled)fsb.hidden=true;
fsb.onclick=e=>{e.stopPropagation();const d=document,el=d.documentElement;
  if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d);
  else{const p=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);p&&p.catch&&p.catch(()=>{})}};
let uiT;function showUI(){$('ui').classList.remove('hide');document.body.classList.remove('nocursor');clearTimeout(uiT);if(!panelOpen)uiT=setTimeout(()=>{if(!panelOpen){$('ui').classList.add('hide');document.body.classList.add('nocursor')}},3500)}
// 클릭 시 영롱한 펜타토닉 오르골 쇠빗 (+ 산타 클릭/소환 시 4음 오르골 아르페지오)
const CHIME=[72,74,76,79,81,84,86,88];
function playChime(hi,gliss){
  if(!audioOn||!AC||AC.state!=='running')return;
  const at=AC.currentTime+.01;
  if(gliss){
    const base=hi?76:72;
    [0,4,7,12].forEach((iv,k)=>playTine(base+iv,at+k*.065,.12,.9,master));
  }else{
    const m=CHIME[(hi?3:0)+(rnd()*(hi?5:6)|0)];
    playTine(m,at,.15,1.1,master);
  }
}
function onTap(x,y){
  // 1. 꼭대기 별 클릭 → 황금 폭죽 + 강한 펄스
  if(starPos.vis&&Math.hypot(x-starPos.x,y-starPos.y)<56*SC_){
    starP=1.6;burst(starPos.x,starPos.y,40,1,1.25);addRing(starPos.x,starPos.y,130*SC_,1);
    for(let k=0;k<8;k++){const li=rnd()*N.l|0;lF[li]=1.6;lFC[li]=1}
    playChime(1,0);return;
  }
  // 2. 비행 중인 산타 썰매 클릭 → 별가루 폭포 + 오르골 아르페지오
  if(santa.on&&Math.hypot(x-santa.x,y-santa.y)<95*santa.sc){
    for(let k=0;k<18;k++){const a=rnd()*TAU,v=(25+rnd()*65)*SC_;addStardust(x,y,Math.cos(a)*v,Math.sin(a)*v-20*SC_,k%2)}
    burst(x,y,24,1,.95);addRing(x,y,105*SC_,0);playChime(1,1);return;
  }
  // 3. 트리 오너먼트 클릭 → 해당 방울 펄스 + 같은 색 불꽃
  let hit=null,best=38*SC_;
  for(const o of B){if(o.k==='b'&&o.vis){const d=Math.hypot(x-o.sx,y-o.sy);if(d<best){best=d;hit=o}}}
  if(hit){
    hit.p=1.6;burst(hit.sx,hit.sy,24,hit.c,.95);addRing(hit.sx,hit.sy,88*SC_,hit.c);playChime(0,0);return;
  }
  // 4. 일반 위치 클릭 → 별빛 불꽃 + 파동 링 + 전구 반응 (+ 상단 밤하늘 클릭 시 산타 호출)
  const ci=rnd()*6|0;
  burst(x,y,22,ci,.9);addRing(x,y,92*SC_,ci);
  for(let k=0;k<4;k++){const li=rnd()*N.l|0;lF[li]=1.5;lFC[li]=ci}
  if(!santa.on&&y<H*.36){startSanta(T);playChime(1,1)}
  else playChime(0,0);
}
cv.addEventListener('pointerdown',e=>{if(panelOpen){setPanel(false);return}if(!AC)toggleSound(true);showUI();onTap(e.clientX,e.clientY)});
addEventListener('pointermove',showUI);syncPanel();showUI();lock();
</script>
